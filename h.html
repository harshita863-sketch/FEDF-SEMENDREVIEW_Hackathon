
<!DOCTYPE html>
<html>
<head>
    <title>College Events</title>
    <style>
       body {
    font-family: Arial;
    margin: 0;
    background: #eee;

    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
        .header { background: #243b55;
             color: white;
              text-align: center;
               padding: 10px; }
        .events { display: flex; 
            justify-content: center; 
            gap: 60px; 
            padding: 20px; }
        .card { background: white; 
            padding: 15px;
             text-align: center; 
            }
        img { width: 150px; 
            height: 100px; }
        button { background: teal; 
            color: white; 
            padding: 8px; 
            cursor: pointer;}
           button:hover {
    background: #830f0f;
    
}

        footer {
    background: #243b55;
    color: white;
    text-align: center;
    padding: 10px;

    margin-top: auto;
}
    </style>
</head>
<body>
    <div class="header">
        <h1>College Event Portal</h1>
        <p>Home | Events | Contact</p>
    </div>

    <h2 align="center">Upcoming Events</h2>
    <h3 align="center">Technical | Cultural | Sports</h3>

    <div class="events">
        <div class="card">
            <img src="https://placehold.co/150x100?text=Hackathon">
            <h3>Hackathon</h3>
            <p>Date: 20 November</p>
            <p>Venue: Computer Lab</p>
            <button>Register</button>
        </div>

        <div class="card">
            <img src="https://placehold.co/150x100?text=Fest">
            <h3>Cultural Fest</h3>
            <p>Date: 25 November</p>
            <p>Venue: College Hall</p>
            <button>Register</button>
        </div>
    </div>

    <footer>
        <p>College Event Portal | Contact Us</p>
    </footer>
</body>
</html>
